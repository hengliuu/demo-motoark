name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Every Worker and container name starts with motoark-demo-
        run: node .github/scripts/check-names.mjs api/worker/wrangler.jsonc web/wrangler.jsonc

  staging:
    needs: guard
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy api Worker
        working-directory: api/worker
        run: pnpm exec wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Build web
        working-directory: web
        run: pnpm exec opennextjs-cloudflare build
      - name: Deploy web Worker
        working-directory: web
        run: pnpm exec opennextjs-cloudflare deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Install Playwright browser
        run: pnpm -C e2e exec playwright install --with-deps chromium
      - name: Wait for staging to answer
        run: |
          deadline=$((SECONDS + 90))
          until [ "$(curl -s --max-time 5 "$STAGING_URL/api/healthz")" = '{"status":"ok"}' ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::Staging did not answer $STAGING_URL/api/healthz with 200 and {\"status\":\"ok\"} within 90 seconds"
              exit 1
            fi
            sleep 5
          done
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
      - name: Smoke test staging
        run: pnpm -C e2e exec playwright test --grep @smoke
        env:
          BASE_URL: ${{ vars.STAGING_URL }}

  production:
    needs: staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy api Worker
        working-directory: api/worker
        run: pnpm exec wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Build web
        working-directory: web
        run: pnpm exec opennextjs-cloudflare build
      - name: Deploy web Worker
        working-directory: web
        run: pnpm exec opennextjs-cloudflare deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
