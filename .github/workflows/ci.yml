name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - run: go vet ./...
        working-directory: api

      - run: go test ./...
        working-directory: api

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -C web lint

      - run: pnpm -C web type-check

      - run: pnpm -C web test

      - run: pnpm -C web build

      - run: pnpm -C e2e exec playwright install --with-deps chromium

      - run: pnpm -C e2e exec playwright test

      - name: Smoke tests on the Workers runtime (OpenNext preview)
        run: make e2e-workers

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/playwright-report-workers
          retention-days: 14
